version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: matricula-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matricula_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - matricula-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matricula-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD no arquivo .env}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - matricula-network

volumes:
  postgres_data:

networks:
  matricula-network:
    driver: bridge
